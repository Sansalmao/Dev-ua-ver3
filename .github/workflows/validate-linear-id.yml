name: "Validar ID de Linear"

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validar Formato del Título
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Expresión regular para detectar el ID de Linear (ej. WEB-123)
          subjectPattern: ^(?=.*\[[A-Z]+-\d+\]).*$
          subjectPatternError: |
            ¡Error! El título del PR debe incluir el ID de Linear entre corchetes.
            Ejemplo: "feat: add login page [WEB-45]"
